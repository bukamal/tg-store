<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>محاسبة المتجر</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
  <div id="app">
    <main id="view"></main>
    <nav id="bottom-nav">

      <button data-view="sell"><span class="nav-icon">🛒</span><span>بيع</span></button>
      <button data-view="history"><span class="nav-icon">📋</span><span>مبيعات</span></button>
      <button data-view="analytics"><span class="nav-icon">📊</span><span>تحليلات</span></button>
      <button data-view="purchases"><span class="nav-icon">📥</span><span>مشتريات</span></button>

      <button data-view="expenses"><span class="nav-icon">💸</span><span>مصاريف</span></button>
      <button data-view="alerts"><span class="nav-icon">🔔</span><span>تنبيهات</span></button>
      <button data-view="categories"><span class="nav-icon">🏷️</span><span>تصنيفات</span></button>

  <script type="module" src="/src/main.js"></script>
